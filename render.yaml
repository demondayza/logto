services:
  - type: web
    name: myeyesid
    env: docker
    repo: https://github.com/myeyesid-io/myeyesid.git
    region: oregon
    branch: master
    envVars:
      - key: ENDPOINT
        value: true
      - key: TRUST_PROXY_HEADER
        value: true
      - key: NO_INQUIRY
        value: 0
      - key: ALL_YES
        value: 1
      - key: DB_URL_DEFAULT
        fromDatabase:
          name: myeyesid-database
          property: connectionString

databases:
  - name: myeyesid-database
    databaseName: myeyesid
    ipAllowList: [] # only allow internal connections
