# This compose file is for demonstration only, do not use in prod.
services:
  app:
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
      args:
        dev_features_enabled: ${DEV_FEATURES_ENABLED-}
        applicationinsights_connection_string: ${APPLICATIONINSIGHTS_CONNECTION_STRING-}
        additional_connector_args: ${ADDITIONAL_CONNECTOR_ARGS-}
    image: ${IMAGE_NAME-myeyesid/log2}:${IMAGE_TAG-dev}
    pull_policy: never
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    ports:
      - 3001:3001
      - 3002:3002
    environment:
      - TRUST_PROXY_HEADER=1
      - DB_URL=postgres://postgres:p0stgr3s@postgres:5432/logto
      # Mandatory for GitPod to map host env to the container, thus GitPod can dynamically configure the public URL of MyEyesID;
      # Or, you can leverage it for local testing.
      - ENDPOINT
      - ADMIN_ENDPOINT
  postgres:
    image: postgres:17-alpine
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: p0stgr3s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5
